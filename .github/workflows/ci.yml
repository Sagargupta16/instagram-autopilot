name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Renovate lock sync dispatches CI on the commit it pushes to a Renovate branch.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --no-build
      - name: Lint
        run: uv run --frozen --no-build ruff check src tests scripts
      - name: Formatting
        run: uv run --frozen --no-build ruff format --check src tests scripts
      - name: Tests and branch coverage
        run: uv run --frozen --no-build pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:output/coverage.xml
      - name: Verify requirements export matches lock
        run: |
          uv export --frozen --no-dev --no-hashes --output-file /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
        shell: bash
  svg-reel-sample:
    name: SVG Reel sample render (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One job per sample: five narrated Reels in a row (about 19 minutes) outgrew the budget.
        sample: [steps-cicd, stat-big-number, timeline-hubble, versus-tcp-udp, myths-space]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install locked runtime
        run: uv sync --frozen --no-dev --no-build
      - name: Install ffmpeg
        run: bash scripts/install_ffmpeg.sh
      - name: Restore the licensed audio library
        id: audio-library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/audio/chill
            assets/audio/upbeat
            assets/audio/cinematic
            assets/audio/catalog_manifest.json
          key: audio-library-${{ hashFiles('assets/audio/catalog.json', 'scripts/fetch_audio_catalog.py') }}
      - name: Download the licensed audio library (the samples render silent if this fails)
        id: fetch-audio
        if: steps.audio-library.outputs.cache-hit != 'true'
        continue-on-error: true
        run: uv run --frozen --no-dev --no-build python scripts/fetch_audio_catalog.py
      - name: Save the licensed audio library
        if: steps.audio-library.outputs.cache-hit != 'true' && steps.fetch-audio.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/audio/chill
            assets/audio/upbeat
            assets/audio/cinematic
            assets/audio/catalog_manifest.json
          key: audio-library-${{ hashFiles('assets/audio/catalog.json', 'scripts/fetch_audio_catalog.py') }}
      # Narration (Kokoro, assets/voice): model files are downloaded, never committed, and cached
      # on the fetch script that pins their hashes. A failed download or environment install never
      # fails the run; SVG Reels then go out music-only.
      - name: Restore the narration voice model
        id: voice-model
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/voice
          key: voice-model-${{ hashFiles('scripts/fetch_voice_model.py') }}
      - name: Download the narration voice model
        id: fetch-voice
        if: steps.voice-model.outputs.cache-hit != 'true'
        continue-on-error: true
        run: uv run --frozen --no-dev --no-build python scripts/fetch_voice_model.py
      - name: Save the narration voice model
        if: steps.voice-model.outputs.cache-hit != 'true' && steps.fetch-voice.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/voice
          key: voice-model-${{ hashFiles('scripts/fetch_voice_model.py') }}
      - name: Install the locked narration environment (Python 3.13)
        continue-on-error: true
        run: uv sync --frozen --no-build --python 3.13 --script scripts/narrate.py
      - name: Show the renderer toolchain
        run: |
          google-chrome --version
          ffmpeg -hide_banner -version | head -1
          fc-match "Inter"
          fc-match "Liberation Sans:bold"
          fc-match "DejaVu Sans:bold"
      - name: Render the sample Reel to MP4 with real Chrome and ffmpeg
        run: |
          args=(--name "$SAMPLE")
          # The shortest sample's job also renders the cover-still gallery of every sample.
          if [[ "$SAMPLE" != stat-big-number ]]; then args+=(--no-stills); fi
          uv run --frozen --no-dev --no-build python scripts/render_svg_reel_sample.py "${args[@]}"
        env:
          SAMPLE: ${{ matrix.sample }}
      - name: Probe the MP4s
        run: |
          for video in output/svg-reel-sample/*.mp4; do
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,profile,width,height,pix_fmt,avg_frame_rate,sample_rate,channels -of compact "$video"
          done
      - name: Upload the MP4 and frames
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svg-reel-sample-${{ matrix.sample }}
          path: output/svg-reel-sample/
          if-no-files-found: error
          retention-days: 1
  svg-reel-sample-artifact:
    name: SVG Reel sample artifact
    needs: svg-reel-sample
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge the per-sample uploads into one artifact, a folder per sample
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svg-reel-sample
          pattern: svg-reel-sample-*
          separate-directories: true
          delete-merged: true
          retention-days: 14
  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@7499fea0c880e95c82e038323e3614a180e69e95
    permissions:
      contents: read
      security-events: write
