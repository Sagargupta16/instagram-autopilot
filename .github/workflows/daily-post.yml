name: Daily Instagram Post

on:
  schedule:
    # Fires at 15:30 UTC (start of US lunch engagement window:
    # 10:30 AM EST / 11:30 AM EDT / 9:00 PM IST). The bot then sleeps
    # a random 0-180 min via POST_JITTER_MAX_MINUTES so the actual post
    # time lands somewhere in the 3-hour peak window and does not look
    # cron-scheduled.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      force_jitter:
        description: "Apply 0-180 min jitter on manual run (normally skipped)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish post
        run: python -m src.main
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          S3_VIDEO_BUCKET: ${{ secrets.S3_VIDEO_BUCKET }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NICHE: ${{ vars.NICHE || 'wide_lifestyle' }}
          CONTENT_TYPES: ${{ vars.CONTENT_TYPES || 'tip,trick,showcase,tutorial,insight' }}

      # Dedup history must survive the ephemeral runner, otherwise every run
      # starts blind and repeats topics/scenes. Runs even if publish failed
      # (history is recorded before publish, intentionally).
      - name: Persist post history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_topics.json
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: record posted topic [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
